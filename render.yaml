services:
  - type: web
    name: shl-recommender
    runtime: python
    buildCommand: pip install fastapi uvicorn[standard] pydantic anthropic
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 35
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set via Render dashboard — never commit your key
      - key: LLM_MODEL
        value: claude-haiku-4-5
    healthCheckPath: /health
    autoDeploy: true
    plan: free
