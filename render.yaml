services:
  - type: web
    name: shl-recommender
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set via Render dashboard — never commit your key
      - key: LLM_MODEL
        value: claude-haiku-4-5
    healthCheckPath: /health
    autoDeploy: true
    plan: free
